name: Atualizar Jogos Futmax

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Copiar repositório
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: |
          pip install requests beautifulsoup4

      - name: Executar script de extração
        run: python gerar_lista.py

      - name: Enviar JSON atualizado para o repositório
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "Bot de Atualização"
          git config --global user.email "bot@users.noreply.github.com"
          git add jogos_futmax.json
          git commit -m "Auto: Atualizar lista de jogos do Futmax" || exit 0
          git push
